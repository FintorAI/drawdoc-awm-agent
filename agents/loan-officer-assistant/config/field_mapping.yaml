# Encompass Field ID → LoanFacts Field Mapping
# 
# This configuration maps Encompass field IDs to normalized LoanFacts field paths.
# Used by fetch_loan_context.py to normalize Encompass responses.
#
# Format:
#   encompass_field_id:
#     path: "loan_facts.field_path"  # Dot-notation path in LoanFacts
#     type: "string|number|boolean|date"  # Data type for conversion
#     description: "Human-readable description"

